[package]
name = "roke"
version = "0.2.0"
edition = "2021"
description = "A terminal todo and kanban app built with ratatui, vim keybindings, and mouse support"

[dependencies]
clap = { version = "4", features = ["derive", "color", "suggestions"] }
clap_complete = "4"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
